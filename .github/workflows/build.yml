name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            qt-version: '5.15.2'
            artifact: cubiomes-viewer-linux.tar.gz
          - os: windows-latest
            qt-version: '5.15.2'
            artifact: cubiomes-viewer-windows.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        if: matrix.os == 'windows-latest'
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ matrix.qt-version }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          archives: 'qtbase qttools'

      - name: Setup MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev qtbase5-dev qt5-qmake qttools5-dev-tools
          qmake cubiomes-viewer.pro
          make
          if [ -f "cubiomes-viewer" ]; then
            tar -czvf cubiomes-viewer-linux.tar.gz cubiomes-viewer
          elif [ -f "bin/cubiomes-viewer" ]; then
            tar -czvf cubiomes-viewer-linux.tar.gz bin/cubiomes-viewer
          fi

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          qmake cubiomes-viewer.pro CONFIG+=release
          nmake
          mkdir -p cubiomes-viewer
          if [ -f "release/cubiomes-viewer.exe" ]; then
            cp release/cubiomes-viewer.exe cubiomes-viewer/
          elif [ -f "debug/cubiomes-viewer.exe" ]; then
            cp debug/cubiomes-viewer.exe cubiomes-viewer/
          elif [ -f "cubiomes-viewer.exe" ]; then
            cp cubiomes-viewer.exe cubiomes-viewer/
          else
            echo "Executable not found!"
            find . -name "*.exe"
            exit 1
          fi
          windeployqt --dir cubiomes-viewer cubiomes-viewer/cubiomes-viewer.exe --compiler-runtime --no-translations --no-system-d3d-compiler --no-opengl-sw --no-angle
          7z a -tzip "${{ matrix.artifact }}" cubiomes-viewer/

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
