name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev qtbase5-dev qt5-qmake qttools5-dev-tools
          qmake cubiomes-viewer.pro
          make -j$(nproc)
          if [ -f "cubiomes-viewer" ]; then
            tar -czvf cubiomes-viewer-linux.tar.gz cubiomes-viewer
          elif [ -f "bin/cubiomes-viewer" ]; then
            tar -czvf cubiomes-viewer-linux.tar.gz bin/cubiomes-viewer
          fi

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cubiomes-viewer-linux
          path: cubiomes-viewer-linux.tar.gz

  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw81'
          archives: 'qtbase qttools'

      - name: Build (Windows)
        shell: cmd
        run: |
          qmake cubiomes-viewer.pro CONFIG+=release
          mingw32-make -j2
          mkdir cubiomes-viewer
          copy release\cubiomes-viewer.exe cubiomes-viewer\ || copy debug\cubiomes-viewer.exe cubiomes-viewer\ || copy cubiomes-viewer.exe cubiomes-viewer\
          windeployqt --dir cubiomes-viewer cubiomes-viewer\cubiomes-viewer.exe --compiler-runtime --no-translations --no-system-d3d-compiler --no-opengl-sw --no-angle
          powershell "Compress-Archive -Path cubiomes-viewer -DestinationPath cubiomes-viewer-windows.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cubiomes-viewer-windows
          path: cubiomes-viewer-windows.zip

  build-macos:
    name: Build on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          archives: 'x86_64 qtbase qttools'
          cache: true

      - name: Build
        run: |
          qmake CONFIG+=release cubiomes-viewer.pro
          CFLAGS="-isysroot /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" make -j$(sysctl -n hw.ncpu)

      - name: Deploy
        run: |
          macdeployqt cubiomes-viewer.app -dmg -no-plugins

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cubiomes-viewer-macos
          path: cubiomes-viewer.dmg

  build-source:
    name: Build Source Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build source bundle
        run: |
             # Create a source tarball excluding .git directories
             tar --exclude='.git*' -czvf cubiomes-viewer-${{github.ref_name}}-src.tar.gz .

      - name: Upload Source Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cubiomes-viewer-source
          path: cubiomes-viewer-${{github.ref_name}}-src.tar.gz

  release:
    name: Create Release
    needs: [build-linux, build-windows, build-macos, build-source]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
